# WORKFLOW FILE GENERIC STRUCTURE:
# --------------------------------
# workflow name
# trigger
# jobs (each job starts with any required setup for that job)
# steps ( the individual actions that make up the job. Custom steps are started with a name.)

name: on_push

on:
  push:
    branch:
      - "**"  # run on all branches

jobs:
  build_and_test:
    runs-on: ubuntu-24.04
    env: # all variables set here get added to $GITHUB_ENV and are available to all steps in this job
      RUNNER_OS: true
      HEADLESS_CHROME: true

    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: 16

      - name: Show OS & Browser versiona
        run: |
          echo "==OS Version=="
          uname -a
          cat /etc/os-release
          
          echo "==Chrome Version=="
          google-chrome --version
          
          echo "== Chrome Binaries"
          which google-chrome
          
          echo "== ChromeDriver Version =="
          chromedriver --version

      - name: Install Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libxss1 \
            libasound2t64 \
            libatk-bridge2.0-0 \
            libgtk-3-0 \
            libgbm1 \
            libxshmfence1 \
            xvfb

      - name: Install Chrome 154 and ChromeDriver 154
        run: |
            # Download Chrome 154
            wget -q https://storage.googleapis.com/chrome-for-testing-public/154.0.8037.57/linux64/chrome-linux64.zip
            unzip -q chrome-linux64.zip
            sudo mv chrome-linux64 /opt/chrome
            sudo ln -sf /opt/chrome/chrome /usr/local/bin/google-chrome
            
            # Download and extract matching ChromeDriver 154
            wget -q https://storage.googleapis.com/chrome-for-testing-public/154.0.8037.92/linux64/chromedriver-linux64.zip
            unzip -q chromedriver-linux64.zip
            sudo mv chromedriver-linux64/chromedriver webdriver_java/resources/chromedriver-linux
            sudo chmod +x webdriver_java/resources/chromedriver-linux
            
            # Verify versions
            google-chrome --version
            webdriver_java/resources/chromedriver-linux --version      
          

     # Capture test start time - I feel this gives a more accurate measure of the actual test run time
      - name: Record start time
        run: echo START_TIME=$(date +%s) >> $GITHUB_ENV

      - name: Run selenium tests with maven
        working-directory: webdriver_java
        run: mvn test

      # Capture metrics regardless of test result.
      - name: Record and collect test data
        working-directory: webdriver_java
        if: always()
        run:  |
          echo "TOTAL_DURATION=$(expr $(date +%s) - ${START_TIME})"
          ./resources/test_result_script.sh

