# WORKFLOW FILE GENERIC STRUCTURE:
# --------------------------------
# workflow name
# trigger
# jobs (each job starts with any required setup for that job)
# steps ( the individual actions that make up the job. Custom steps are started with a name.)

name: on_push

on:
  push:
    branch:
      - "**"  # run on all branches

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    env:
      RUNNER_OS: true
      HEADLESS_CHROME: true

    steps:
      # Capture build start time on linux
#      - name: Record start time
#        run: echo START_TIME=$(date +%s) >> $GITHUB_ENV

      - uses: actions/checkout@v2

      - uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: 16

#      - name: Install Chrome 153
#        run: |
#          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
#          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
#          sudo apt-get update
#          sudo apt-get install -y google-chrome-stable=152.0.7977.64-1

      - name: Uninstall Chrome 152
        run: |
          sudo apt-get remove -y google-chrome-stable
          sudo apt-get autoremove -y
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update

      - name: Install Chrome 153
        run: |
          wget -q https://storage.googleapis.com/chrome-for-testing-public/153.0.8010.36/linux64/chrome-linux64.zip
          unzip -q chrome-linux64.zip
          sudo mv chrome-linux64 /opt/chrome
          sudo ln -sf /opt/chrome/chrome /usr/local/bin/google-chrome
          
          # Download and extract matching ChromeDriver 153 to replace bundled version
          wget -q https://storage.googleapis.com/chrome-for-testing-public/153.0.8010.36/linux64/chromedriver-linux64.zip
          unzip -q chromedriver-linux64.zip
          sudo mv chromedriver-linux64/chromedriver webdriver_java/resources/chromedriver-linux
          sudo chmod +x webdriver_java/resources/chromedriver-linux
    
          google-chrome --version
          webdriver_java/resources/chromedriver-linux --version

     # Capture test start time - I feel this gives a more accurate measure of the actual test run time
      - name: Record start time
        run: echo START_TIME=$(date +%s) >> $GITHUB_ENV

      - name: Run selenium tests with maven
        working-directory: webdriver_java
        run: mvn test

      # Capture metrics regardless of test result.
      - name: Record and collect test data
        working-directory: webdriver_java
        if: always()
        run:  |
          echo "TOTAL_DURATION=$(expr $(date +%s) - ${START_TIME})"
          ./resources/test_result_script.sh

